</filter>
<filter fluent.**>
  @type record_transformer
  <record>
    hostname ${record["Hostname"]}
    app_name ${record["programname"]}
    level ${tag_parts[1]}
  </record>
</filter>
<filter syslog>
  @type record_transformer
  <record>
    hostname ${record["Hostname"]}
    app_name ${record["programname"]}
    level ${record["log_level"]}
  </record>
</filter>
<filter syslog.**>
  @type record_transformer
  <record>
    hostname ${record["Hostname"]}
