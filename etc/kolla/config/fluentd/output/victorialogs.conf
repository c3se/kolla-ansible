<filter unmatched>
  @type record_transformer
  <record>
    hostname ${record["Hostname"]}
    app_name ${record["programname"]}
    level "info"
  </record>
</filter>
<filter *.var.log.kolla.*.*.log>
  @type record_transformer
  <record>
    hostname ${record["Hostname"]}
    app_name ${record["programname"]}
    level "info"
  </record>
</filter>
<filter openstack_python>
  @type record_transformer
  <record>
    hostname ${record["Hostname"]}
    app_name ${record["programname"]}
    level "info"
  </record>
</filter>
<filter wsgi_access>
  @type record_transformer
  <record>
    hostname ${record["Hostname"]}
    app_name ${record["programname"]}
    level "info"
  </record>
</filter>
<filter apache_access>
  @type record_transformer
  <record>
