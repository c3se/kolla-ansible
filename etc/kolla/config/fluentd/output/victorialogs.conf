    level ${record["log_level"]}
  </record>
</filter>
<filter infra.**>
  @type record_transformer
  <record>
    hostname ${record["Hostname"]}
    app_name ${record["programname"]}
    level ${record["log_level"]}
  </record>
</filter>
<match **>
  @type http
  endpoint "http://mimir-37:9428/insert/jsonline"
  headers {"VL-Msg-Field": "Payload", "VL-Time-Field": "Timestamp", "VL-Stream-Fields": "path"}
  <format>
    @type json
  </format>
  <auth>
    method basic
    username admin
    password {{ fluentd_victorialogs_password }}
  </auth>
</match>
